<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregas de Videojuegos - Nehuén Gallitelli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 2.5rem;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
        }
        .card h2 {
            font-size: 1.3rem;
            color: #38bdf8;
        }
        .card p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.4;
        }
        .badge {
            align-self: flex-start;
            background: #0284c7;
            color: white;
            font-size: 0.8rem;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            font-weight: 600;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Entregas de Videojuegos (IPV)</h1>
        <p class="subtitle">Nehuén Gallitelli — Demos jugables en la web</p>
        
        <div class="grid">
            <a href="entrega-2/" class="card">
                <h2>Entrega 2</h2>
                <p>Player con aceleración e inercia, cañón con seguimiento al mouse y torretas enemigas activas.</p>
                <span class="badge">Jugar Demo ▶</span>
            </a>
        </div>
    </div>
</body>
</html>
